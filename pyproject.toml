[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenforge-local"
version = "0.2.0"
description = "Local-first image/STL-to-layer-color 3D preview workflow for manual filament swaps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tokenforge Local" }]
dependencies = [
    "nicegui>=2.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "trimesh>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tokenforge-local = "tokenforge_local.app:main"
tokenforge-preview-smoke = "tokenforge_local.preview_smoke:main"
tokenforge-3d-smoke = "tokenforge_local.three_d_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
